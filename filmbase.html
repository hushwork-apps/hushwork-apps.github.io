<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FilmBase</title>
<meta name="description" content="A personal film and TV ledger. Free, with no account and no ads.">
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 720px;
         margin: 0 auto; padding: 4rem 1.25rem; color: #222; line-height: 1.6; }
  h1 { color: #1FA9A6; margin-bottom: 0.25rem; }
  a { color: #1FA9A6; }
  .stores a { display: inline-block; margin: 0.5rem 1rem 0.5rem 0; font-weight: 600; }
</style>
<script>
  // Invites from the app link here (GH #87), so one link works whichever
  // phone the friend has. iPhones and iPads go to the App Store, Android to
  // Play; anything else stays on this page and picks a store itself.
  (function () {
    var ua = navigator.userAgent || '';
    var ios = /iPhone|iPad|iPod/.test(ua) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (ios) {
      location.replace('https://apps.apple.com/app/id6820375814');
    } else if (/Android/.test(ua)) {
      location.replace('https://play.google.com/store/apps/details?id=com.hushwork.filmbase');
    }
  })();
</script>
</head>
<body>
<h1>FilmBase</h1>
<p>A personal film and TV ledger. Rate what you watch, keep your library, and see your stats. Free, with no account and no ads.</p>
<p class="stores">
  <a href="https://apps.apple.com/app/id6820375814">App Store (iPhone)</a>
  <a href="https://play.google.com/store/apps/details?id=com.hushwork.filmbase">Google Play (Android)</a>
</p>
<p><a href="filmbase-support.html">Support</a> &middot; <a href="filmbase-privacy.html">Privacy policy</a></p>
</body>
</html>
